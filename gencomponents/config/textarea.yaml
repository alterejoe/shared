name: Textarea
struct: Textarea
template: textarea_base.templ

variants:
  - name: Primary
    prefix: textareaprimary
    props:
      bgClass: bg-primary
      borderClass: border border-primary
      textClass: text-white placeholder-white/70

  - name: Secondary
    prefix: textareasecondary
    props:
      bgClass: bg-secondary
      borderClass: border border-secondary
      textClass: text-white placeholder-white/70

  - name: Tertiary
    prefix: textareatertiary
    props:
      bgClass: bg-tertiary
      borderClass: border border-tertiary
      textClass: text-white placeholder-white/70

  - name: Quaternary
    prefix: textareaquaternary
    props:
      bgClass: bg-quaternary
      borderClass: ""
      textClass: text-white placeholder-gray-400

  - name: Accent
    prefix: textareaaccent
    props:
      bgClass: bg-accent
      borderClass: border border-accent
      textClass: text-white placeholder-white/70

  - name: Unique
    prefix: textareaunique
    props:
      bgClass: bg-unique
      borderClass: border border-unique
      textClass: text-white placeholder-white/70

  - name: Attention
    prefix: textareaattention
    props:
      bgClass: bg-attention
      borderClass: border border-attention
      textClass: text-white placeholder-white/70

  - name: Default
    prefix: textarea
    props:
      bgClass: bg-white
      borderClass: border border-gray-300
      textClass: text-gray-900 placeholder-gray-400
